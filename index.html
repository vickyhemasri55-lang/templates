<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ cfg.BOT_NAME }}</title>
<style>
:root{--a:{{ cfg.THEME.accent }};--b:{{ cfg.THEME.accent2 }};--bg:{{ cfg.THEME.background }};--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--text:#f3f4f8;--muted:#a5a9bd}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
body::before,body::after{content:"";position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;animation:drift 18s ease-in-out infinite alternate}
body::before{background:var(--a);top:-18vmax;left:-14vmax}
body::after{background:var(--b);bottom:-20vmax;right:-14vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}
.app{position:relative;z-index:1;width:min(960px,96vw);height:min(92vh,860px);display:grid;grid-template-columns:250px 1fr;background:var(--card);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(22px);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
aside{padding:26px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;background:rgba(0,0,0,.18)}
.logo{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 10px 28px rgba(0,0,0,.4)}
aside h1{font-size:19px;letter-spacing:.06em;line-height:1.25}
aside p{color:var(--muted);font-size:13.5px;line-height:1.5}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:12px;font-size:13px;text-align:left;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--a);transform:translateX(4px);background:rgba(255,255,255,.1)}
.clear{margin-top:auto;background:none;border:1px dashed var(--line);color:var(--muted);padding:9px;border-radius:12px;cursor:pointer;font-size:13px}
.clear:hover{color:var(--text);border-color:var(--b)}
main{display:flex;flex-direction:column;min-width:0}
header{display:none;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center;gap:10px;font-weight:600}
#chat{flex:1;overflow-y:auto;padding:26px 26px 10px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
#chat::-webkit-scrollbar{width:6px}#chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.msg{max-width:82%;padding:12px 16px;border-radius:18px;line-height:1.6;font-size:15px;word-wrap:break-word;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.bot{align-self:flex-start;background:rgba(255,255,255,.08);border:1px solid var(--line);border-bottom-left-radius:5px}
.user{align-self:flex-end;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-bottom-right-radius:5px;font-weight:500}
.msg p{margin:.3em 0}.msg ul{margin:.4em 0 .4em 1.3em}
.msg code{background:rgba(0,0,0,.35);padding:2px 6px;border-radius:6px;font-size:13.5px}
.msg pre{background:rgba(0,0,0,.4);padding:12px;border-radius:12px;overflow-x:auto;margin:.5em 0}
.msg pre code{background:none;padding:0}
.error{border-color:#f87171;color:#fecaca}
.typing{display:flex;gap:5px;padding:16px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--b);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
form{display:flex;gap:10px;padding:16px 22px 22px}
textarea{flex:1;resize:none;height:52px;max-height:130px;padding:15px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--text);font:inherit;font-size:15px;outline:none;transition:.2s}
textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
button.send{width:52px;height:52px;border:none;border-radius:16px;cursor:pointer;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));transition:.2s}
button.send:hover{transform:scale(1.07) rotate(-6deg)}
button.send:disabled{opacity:.5;cursor:not-allowed;transform:none}
@media(max-width:760px){
.app{grid-template-columns:1fr;height:100vh;width:100vw;border-radius:0}
aside{display:none}header{display:flex}.msg{max-width:92%}#chat{padding:16px 14px 6px}form{padding:12px 14px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">{{ cfg.EMOJI }}</div>
    <div>
      <h1>{{ cfg.BOT_NAME }}</h1>
      <p>{{ cfg.TAGLINE }}</p>
    </div>
    <div class="label">Try asking</div>
    <div class="chips">
      {% for s in cfg.SUGGESTIONS %}
      <button class="chip" type="button">{{ s }}</button>
      {% endfor %}
    </div>
    <button class="clear" type="button" id="clear">Clear chat</button>
  </aside>
  <main>
    <header><span>{{ cfg.EMOJI }}</span><span>{{ cfg.BOT_NAME }}</span></header>
    <div id="chat"></div>
    <form id="form">
      <textarea id="input" placeholder="Ask a study question..." rows="1" maxlength="2000"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send">➤</button>
    </form>
  </main>
</div>
<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const WELCOME = {{ cfg.WELCOME_MESSAGE | tojson }};
let history = [];

function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function format(text){
  let html = esc(text);
  html = html.replace(/```(?:\w+)?\n?([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
  html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const lines = html.split("\n");
  let out = "", inList = false;
  for (const line of lines){
    const m = line.match(/^\s*[-*]\s+(.*)/);
    if (m){ if(!inList){out += "<ul>"; inList = true;} out += "<li>" + m[1] + "</li>"; }
    else { if(inList){out += "</ul>"; inList = false;} if(line.trim()) out += "<p>" + line + "</p>"; }
  }
  if (inList) out += "</ul>";
  return out;
}

function addMessage(text, who, isError){
  const div = document.createElement("div");
  div.className = "msg " + who + (isError ? " error" : "");
  if (who === "bot") div.innerHTML = format(text); else div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function showTyping(){
  const div = document.createElement("div");
  div.className = "msg bot typing";
  div.innerHTML = "<i></i><i></i><i></i>";
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send(text){
  text = text.trim();
  if (!text) return;
  addMessage(text, "user");
  input.value = "";
  input.style.height = "52px";
  sendBtn.disabled = true;
  const typing = showTyping();
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, history: history})
    });
    const data = await res.json();
    typing.remove();
    if (!res.ok || data.error){
      addMessage(data.error || "Something went wrong.", "bot", true);
    } else {
      addMessage(data.reply, "bot");
      history.push({role: "user", text: text}, {role: "model", text: data.reply});
      history = history.slice(-16);
    }
  } catch (e) {
    typing.remove();
    addMessage("Network error. Please check your connection.", "bot", true);
  }
  sendBtn.disabled = false;
  input.focus();
}

form.addEventListener("submit", e => { e.preventDefault(); send(input.value); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(input.value); }
});
input.addEventListener("input", () => {
  input.style.height = "52px";
  input.style.height = Math.min(input.scrollHeight, 130) + "px";
});
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => send(c.textContent)));
document.getElementById("clear").addEventListener("click", () => {
  chat.innerHTML = ""; history = []; addMessage(WELCOME, "bot");
});
addMessage(WELCOME, "bot");
</script>
</body>
</html>
